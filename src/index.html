<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мій проєкт</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background-color: #c8ff00; /* Ваш салатовий колір */
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wrapper h1 {
      font-size: 5rem;       /* Великий чіткий текст */
      font-weight: 900;
      color: #111111;
      line-height: 1;
      text-align: center;
    }

    .wrapper img {
      width: 150px;          
      height: auto;
      margin-top: 15px;     
      display: block;
      mix-blend-mode: multiply; 
    }
  </style>
</head>
<body>

  <main class="wrapper">
    <h1>привіт</h1>
    <img src="img/image.png" alt="Банан">
  </main>

  <script src="js/main.min.js"></script>
</body>
</html>
